<!DOCTYPE html>
<html lang="en">
<head>

      "@type": "Restaurant",
      "name": "Kota Joint Takeaway",
      "image": "assets/images/logo.svg",
      "telephone": "+27-11-123-4567",
      "address": {

        "streetAddress": "123 Main Street",
        "addressLocality": "Johannesburg",

    <nav class="navbar">
